# =============================================================================
# verify/scenarios/beit-shawarma-preview.yml — a USER SCENARIO (scenario/v1)
# =============================================================================
# A diner opens the Beit Shawarma preview at /beit-shawarma/, sees the preview
# notice in the announcement bar and the restaurant's headline, follows "See
# the menu" to the menu cards, switches to the Party trays tab for the catering
# page and its request form, and reaches the contact page. The old site's /home
# address redirects to the new home page.
#
# `unindexed` fails if the preview could compete with the restaurant's real
# domain in search: every page must carry robots noindex, and no page may
# declare www.beitshawarma.com as its canonical. `menu_prices` and
# `tray_prices` fail when a price is missing or malformed: 37 on the menu and
# 2 trays on the catering page are all 39 items in content/menu.json. The pages
# are plain HTML generated by src/beit-shawarma/build.py, so Jekyll copies them
# byte for byte.
# =============================================================================
id: beit-shawarma-preview
feature: PROFILE-010
title: "A diner browses the Beit Shawarma preview"
description: "A diner opens /beit-shawarma/, follows See the menu to the menu cards, switches to Party trays for the catering page and its request form, reaches the contact page, and the old /home address redirects to the new home page; every page stays out of search engines."
viewports:
  - mobile
  - { name: desktop-1366, width: 1366, height: 768 }
steps:
  - goto: /beit-shawarma/
  - expect: { status: 200 }
  - expect: { visible: ".announce--preview" }
  - expect: { text: "Tastes like home." }
  - expect: { no_horizontal_scroll: true }
  - eval:
      name: unindexed
      script: |-
        (() => {
          const robots = document.querySelector('meta[name="robots"]')?.content || '';
          if (!robots.includes('noindex')) throw new Error('home page is indexable: robots=' + robots);
          const canonical = document.querySelector('link[rel="canonical"]')?.href || '';
          if (canonical.includes('beitshawarma.com')) throw new Error('preview claims the live domain as canonical: ' + canonical);
          const ld = [...document.querySelectorAll('script[type="application/ld+json"]')].map((s) => JSON.parse(s.textContent)['@type']);
          return { robots, canonical, ld };
        })()
  - screenshot: home
  - click: "main a[href='menu/']"
  - wait: { url: "/beit-shawarma/menu/" }
  - expect: { count: { selector: ".menu-card", min: 6 } }
  - expect: { no_horizontal_scroll: true }
  - eval:
      name: menu_prices
      script: |-
        (() => {
          const prices = [...document.querySelectorAll('.menu-item .price')].map((p) => p.textContent.trim());
          const bad = prices.filter((p) => !/^\$\d+\.\d{2}$/.test(p));
          if (prices.length !== 37) throw new Error('expected 37 priced menu items, found ' + prices.length);
          if (bad.length) throw new Error('malformed prices: ' + bad.join(', '));
          return { items: prices.length };
        })()
  - screenshot: menu
  - click: ".tabs a[href='../catering/']"
  - wait: { url: "/beit-shawarma/catering/" }
  - expect: { count: { selector: ".tray-card", min: 2 } }
  - expect: { visible: "form#catering-form" }
  - expect: { no_horizontal_scroll: true }
  - eval:
      name: tray_prices
      script: |-
        (() => {
          const prices = [...document.querySelectorAll('.tray-card .price')].map((p) => p.textContent.trim());
          if (prices.length !== 2 || prices.some((p) => !/^\$\d+\.\d{2}$/.test(p))) throw new Error('tray prices: ' + prices.join(', '));
          return { trays: prices };
        })()
  - screenshot: catering
  - goto: /beit-shawarma/contact/
  - expect: { status: 200 }
  - expect: { visible: "form#contact-form" }
  - screenshot: contact
  - goto: /beit-shawarma/home/
  - wait: { ms: 1500 }
  - eval:
      name: legacy_home_redirect
      script: |-
        (() => {
          if (location.pathname !== '/beit-shawarma/') throw new Error('/home did not redirect: at ' + location.pathname);
          return location.pathname;
        })()
  - expect: { text: "Tastes like home." }
  - expect: { no_console_errors: true }
